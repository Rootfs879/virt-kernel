name: Kernel Creator

on:
  workflow_dispatch: 
    inputs:
      cl_rs:
        type: boolean
        description: 'Cleanup Runner'
        default: false

jobs:
  debug-runner:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailnet
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install and configure OpenSSH
        env:
          RUNNER_SSH_PUBLIC_KEY: ${{ vars.RUNNER_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_SSH_PUBLIC_KEY"

          sudo apt-get update
          sudo apt-get install -y openssh-server

          runner_user="$(whoami)"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$RUNNER_SSH_PUBLIC_KEY" > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo chown -R "$runner_user:$runner_user" "$HOME/.ssh"

          printf 'PubkeyAuthentication yes\nPasswordAuthentication no\nPermitRootLogin yes\nAllowUsers %s\n' \
            "$runner_user" | sudo tee /etc/ssh/sshd_config.d/99-runner.conf
          sudo sshd -t
          sudo systemctl enable --now ssh

          echo "RUNNER_USER=$runner_user" >> "$GITHUB_ENV"
          
      - name: Cleanup Runner Space Aggressively
        if: ${{ inputs.cl_rs }}
        run: |
          echo "=== Disk Space Before Cleaning ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt-get remove -y --purge \
            "ghc*" "dotnet*" "llvm*" "clang*" "lldb*" \
            "php*" "google-chrome-stable" "microsoft-edge-stable" \
            "firefox" "azure-cli" \
            "desktop-base" "gnome*" "x11-common"
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/* /var/tmp/*

          echo "=== Disk Space After Cleaning ==="
          df -h

      - name: Updating APT
        run: |
          sudo apt update
      
      - name: Install Compiling Tools
        run: |
          sudo apt install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          bc \
          dwarves \
          zstd \
          cpio \
          wget
          
      - name: Display Connection Info
        run: |
          RUNNER_IP=$(tailscale ip -4)
          echo "Run this in your terminal: ssh runner@$RUNNER_IP"
          echo "If you are completed on doing something and want to upload the artifact, run: touch /tmp/continue"

      - name: Hold Execution for SSH
        run: |
          while [ ! -f /tmp/continue ]; do
            sleep 5
          done
